[project]
name = "plotting-helpers"
version = "0.1.0"
description = "Definition of plotting styles and helper functions that I use frequently across projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plotly = ["plotly>=5"]
export = ["plotly>=5", "kaleido"]
matplotlib = ["matplotlib"]

[dependency-groups]
dev = [
    "pytest",
    "plotly>=5",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/plotting_helpers.py"]
sources = ["src"]
